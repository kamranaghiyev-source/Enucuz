<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>

        <div><b>Enucuz.az</b><div class="small">Сравнение цен • товары • услуги</div></div>
      </div>
      <div class="menu"><a href="index.html">Главная</a>
<a href="products.html" style="background:rgba(255,255,255,.08)">Товары</a>

  <div class="small">Поиск и фильтр. «Купить / Заказать» → WhatsApp или платёжная ссылка.</div>
  <div class="toolbar">
    <input id="q" class="input" placeholder="Поиск: iPhone, кондиционер, посуда..." />
    <select id="category"></select>
    <div class="kpi"><b id="count">0</b><span>позиций</span></div>
  </div>
  <div id="list" class="list"></div>
</div>
<script>Site.initProducts();</script>
  </div>
  <div class="footer">© <span id="y"></span> Enucuz.az • <span class="small" id="legal"></span></div>
  <script src="app.js"></script>
  <script>
    document.getElementById('y').textContent = new Date().getFullYear();
    fetch('data/config.json').then(r=>r.json()).then(cfg=>{
      document.title = (document.title||'') + ' — ' + cfg.site_name;
      const l = document.getElementById('legal'); if(l) l.textContent = cfg.legal_notice || '';
    });
  </script>
